name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: "10.28.2"
  NODE_VERSION: "24"
  DATABASE_URL: "postgres://holdfast:holdfast@localhost:5432/holdfast"
  REDIS_URL: "redis://localhost:6379"
  S3_ENDPOINT: "http://localhost:9000"
  S3_BUCKET: "holdfast-evidence"
  S3_ACCESS_KEY: "holdfast"
  S3_SECRET_KEY: "holdfastpassword"
  S3_FORCE_PATH_STYLE: "true"
  JWT_SECRET: "ci-secret-dev-jwt-key"
  ESCROW_MODE: "A"

jobs:
  # ── Rust: contract ──────────────────────────────────────────────────────────
  contract:
    name: Contract (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none,wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  # ── TypeScript: lint / typecheck / unit tests / e2e ─────────────────────────
  typescript:
    name: TypeScript (lint / typecheck / test / e2e)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start Docker services (Postgres, Redis, MinIO)
        run: |
          docker compose -f infra/docker-compose.yml up -d
          # Wait for Postgres and Redis readiness
          until docker compose -f infra/docker-compose.yml exec -T postgres pg_isready -U holdfast; do
            echo "Waiting for postgres..."
            sleep 2
          done
          until docker compose -f infra/docker-compose.yml exec -T redis redis-cli ping | grep PONG; do
            echo "Waiting for redis..."
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages first
        run: pnpm --filter @holdfast/shared --filter @holdfast/db --filter @holdfast/contract-client build

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (Unit & Integration)
        run: pnpm test

      - name: Install Playwright Browsers with OS dependencies
        run: pnpm --filter @holdfast/web exec playwright install --with-deps chromium

      - name: Build web application
        run: pnpm --filter @holdfast/web build

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e

      - name: Stop Docker services
        if: always()
        run: docker compose -f infra/docker-compose.yml down
